name: Deploy to Salesforce

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Salesforce CLI with NPM
        run: |
          npm install -g npm@latest
          # Added --allow-scripts flag to resolve CLI installation warnings safely
          npm install @salesforce/cli --global --allow-scripts=@salesforce/cli,yarn,protobufjs

      - name: Authenticate to Salesforce
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" | sf org login sfdx-url --alias vscodeOrg --set-default --sfdx-url-stdin

      - name: Deploy to Salesforce
        run: |
          sf project deploy start --target-org vscodeOrg --wait 30
