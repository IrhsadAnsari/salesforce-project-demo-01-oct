name: Deploy to Salesforce

on:
  push:
    branches:
      - main

jobs:
  deploy:
    # Changed from ubuntu-latest to pin it to a stable image during the GitHub migration period
    runs-on: ubuntu-24.04

    steps:
      # Upgraded from @v3 to @v4 to resolve the Node.js deprecation warning
      - name: Checkout Code
        uses: actions/checkout@v4

      # Combined step to update npm and install Salesforce CLI safely
      - name: Install Salesforce CLI with NPM
        run: |
          npm install -g npm@latest
          npm install @salesforce/cli --global

      - name: Authenticate to Salesforce
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" | sf org login sfdx-url --alias vscodeOrg --set-default --sfdx-url-stdin

      - name: Deploy to Salesforce
        run: |
          sf project deploy start --target-org vscodeOrg --wait 30
