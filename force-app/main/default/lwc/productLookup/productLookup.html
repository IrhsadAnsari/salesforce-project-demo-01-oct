<template>
    <lightning-card>
        <div class="slds-p-horizontal_small">
            <lightning-input type="search" value={searchKey} onchange={handleKeyChange} placeholder="Search Product..."></lightning-input>
        </div>

        <div if:true={messageResult} class="slds-p-horizontal_small">
            <p class="slds-text-color_error">No Result Found!</p>
        </div>

        <template if:true={showSearchedValues}>
            <div class="slds-p-horizontal_small">
                <ul class="slds-list_vertical-space">
                    <template for:each={products} for:item="prodObj">
                        <li key={prodObj.Id} onclick={handleParentSelection} data-product-id={prodObj.Id} data-label={prodObj.Name} 
                            class="slds-p-around_small slds-text-link" style="cursor: pointer;">
                            {prodObj.Name}
                        </li>
                    </template>
                </ul>
            </div>
        </template>

      <!--  <div if:true={productId} class="slds-p-horizontal_small">
            <p class="slds-text-heading_small">Selected product Id: {productId}</p>
        </div>
        <div if:true={searchKey} class="slds-p-horizontal_small">
            <p class="slds-text-heading_small">Selected Product Name: {searchKey}</p>
        </div>-->
    </lightning-card>
</template>
