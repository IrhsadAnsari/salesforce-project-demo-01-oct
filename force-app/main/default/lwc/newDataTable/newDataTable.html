<template>
    <lightning-card title="Data table" icon-name="standard:account">
        <lightning-input type="search" label="Search" value={name} onchange={handleNameChange}></lightning-input> 
        <p>{name}</p> 
        <lightning-button label="Search Account" variant="brand" onclick={handleSearch}></lightning-button>
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>
        <lightning-datatable
        key-field="Id"
        columns={columns}
        data={dataList}
        draft-values={draftValues}
        onsave={handleSave}
        onrowselection={handleRowSelection}
        onrowaction={handleRowAction}
        ></lightning-datatable>
        <div class="slds-m-top_medium slds-align_absolute-center">
            <lightning-button label="Next" variant="brand" onclick={handleNext} disabled={isNextDisabled}></lightning-button>
            <span class="slds-p-horizontal_medium">Page {pageNumber} of {pageSize}</span>
            <lightning-button label="Back" variant="brand" onclick={handleBack} disabled={isBackDisabled}></lightning-button>
        </div>
    </lightning-card>
</template>
