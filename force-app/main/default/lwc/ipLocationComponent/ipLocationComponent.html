<template>
    <lightning-card title="IP Complete Location" icon-name="custom:custom63">
        <div class="slds-m-around_medium">
            <lightning-input
                label="Enter IP Address"
                value={ipAddress}
                onchange={handleIpChange}
            ></lightning-input>
            <lightning-button label="Search" onclick={handleSearch} class="slds-m-top_small"></lightning-button>
        </div>

        <!-- This is for Ip and field search for a specific field of an IP -->
        <div class="slds-m-around_medium">
            <lightning-input
                label="Enter IP Address1"
                value={ipAddress1}
                onchange={handleIpChange1}
            ></lightning-input>
            <lightning-input
                label="Enter the Field name"
                value={addressField}
                onchange={handleAdressChnage}
            ></lightning-input>
            <lightning-button label="Search Location" onclick={handleSearchLocation} class="slds-m-top_small"></lightning-button>
        </div>

        <template if:true={responseField}>
            <p>Location: {responseField}</p>
        </template>

        <template if:true={locationData}>
            <p>IP: {locationData.ip}</p>
            <p>City: {locationData.city}</p>
            <p>Region: {locationData.region}</p>
            <p>Country: {locationData.country_name} ({locationData.country_code})</p>
            <p>Latitude: {locationData.latitude}</p>
            <p>Longitude: {locationData.longitude}</p>
        </template>

        <template if:true={mapMarkers}>
            <lightning-map 
                map-markers={mapMarkers}
                zoom-level="10"
                center={mapCenter}
                class="slds-m-top_medium">
            </lightning-map>
        </template>

        <template if:true={error}>
            <p class="slds-text-color_error">Error: {error}</p>
        </template>
    </lightning-card>
</template>
