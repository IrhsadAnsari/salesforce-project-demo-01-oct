<template>
<Lightning-card title="Line item Addition for Parent object" icon-name="standard:account">
  <lightning-input type="search" label ="Enter Product" value={searchKey} placeholder="Enter product name for search" onchange={handleProductSearch}></lightning-input>
  
       <template lwc:if={contacts}>
          <lightning-datatable key-field="Id"
              data={contacts} 
              columns={columns}
              onrowselection={handleRowSelection}
              >
          </lightning-datatable>
        </template>
        <template lwc:else>
            <p>There is no Item for this name</p>
        </template>
        <template lwc:if={selectedContacts}>
            <lightning-button variant ='bare' label="Update Contact to Opportunity" onclick={handleContactAddition} class="slds-m-top_medium"></lightning-button>
        </template>
</Lightning-card>
</template>
